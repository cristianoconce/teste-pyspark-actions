name: Teste PySpark Automatizado

on: [push]  # Roda toda vez que você altera o código

jobs:
  meu-job-de-teste:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Instalar Java (Obrigatório pro Spark)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Instalar PySpark e Pytest
        run: pip install -r requirements.txt

      - name: Rodar os Testes
        run: pytest
